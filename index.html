async function interpretaCatalogo(file){
  const L = await primeiraAba(file); const hi = L.findIndex(r=>r&&r.some(c=>/isbn/i.test(String(c))));
  if(hi<0) throw new Error('catalogo');
  const cab = L[hi].map(c=>normT(c));
  const col = (...al)=>{ let i=cab.findIndex(k=>al.includes(k)); if(i<0) i=cab.findIndex(k=>al.some(a=>k.includes(a))); return i; };
  const cI=col('isbn - impresso','isbn impresso'), cT=col('titulo'), cS=col('subtitulo'), cE=col('editora'), cA=col('autor'), cIl=col('ilustrador'), cP=col('preco');
  if(cI<0||cT<0||cP<0) throw new Error('catalogo');
  const ed = e => { const n=normT(e); return /prefacio/.test(n)?'Prefácio' : /rovelle/.test(n)?'Rovelle' : /movimenta|mvt/.test(n)?'Movimenta' : titleCaseL(e); };
  const itens=[];
  L.slice(hi+1).forEach(r=>{ if(!r) return;
    const isbn=String(r[cI]==null?'':r[cI]).replace(/\.0+$/,'').replace(/\D/g,''); if(!isbn) return;
    let t=limpa(r[cT]); const sb=cS>=0?limpa(r[cS]):''; if(sb&&!normT(t).includes(normT(sb))) t=t+': '+sb;
    const pr=r[cP]; const pn=typeof pr==='number'?pr:parseFloat(String(pr==null?'':pr).replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));
    itens.push({i:isbn,t:titleCaseL(t),e:ed(cE>=0?r[cE]:''),a:limpa(cA>=0?r[cA]:'').replace(/\s+/g,' '),il:limpa(cIl>=0?r[cIl]:'').replace(/\s+/g,' '),p:isFinite(pn)&&pn>0?Math.round(pn*100)/100:null});
  });
  return {itens, origem:file.name, atualizadoEm:new Date(file.lastModified).toISOString()};
}
async function interpretaClientes(file){
  const L = await primeiraAba(file); const hi = L.findIndex(r=>r&&r.some(c=>/raz[aã]o|cliente|nome/i.test(String(c))));
  if(hi<0) return [];
  const cab = L[hi].map(c=>normT(c));
  const col = (...al)=>cab.findIndex(k=>al.some(a=>k.includes(a)));
  const m={razao:col('razao','cliente','nome'),fantasia:col('fantasia'),tipo:col('tipo'),cnpj:col('cnpj'),contato:col('contato'),email:col('e-mail','email'),telefone:col('telefone','fone'),endereco:col('endereco'),cidade:col('cidade'),uf:col('uf')};
  if(m.fantasia===m.razao) m.razao=cab.findIndex(k=>k.includes('razao'));
  const hash = t => { let h=0; for(const ch of t) h=(h*31+ch.charCodeAt(0))|0; return (h>>>0).toString(36); };
  return L.slice(hi+1).filter(r=>r&&limpa(r[m.razao])).map(r=>{ const o={}; for(const k in m) o[k]=m[k]>=0?limpa(r[m[k]]):''; o.uf=o.uf.toUpperCase(); o.id='f_'+hash(normT(o.razao)+'|'+o.cnpj.replace(/\D/g,'')); return o; });
}

}

    $$('#linhas button').forEach(b=>b.onclick=()=>{ if(S.linha===b.dataset.linha) return; S.linha=b.dataset.linha; S.tab=S.tabL[S.linha]; guardaNav(); render(); window.scrollTo(0,0); }); }
  $('#tabs').innerHTML = tabsAtuais().map(([k,l])=>`<button role="tab" type="button" data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('');
  $$('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t; S.tabL[S.linha]=S.tab; if(litInvalida.pend && S.tab!=='lorc' && S.tab!=='lprecos'){ litInvalida.pend=false; litInvalida(); } guardaNav(); render(); window.scrollTo(0,0);});
}
function guardaNav(){
  try{ localStorage.setItem('mvt-linha',S.linha); localStorage.setItem('mvt-tabs',JSON.stringify(S.tabL)); }catch(e){}
  try{ history.replaceState(null,'','#'+S.linha+'/'+S.tab); }catch(e){}
}
function cabecalho(){
  $('#meta').textContent = pronto
    ? `${fmt(BASE.vendas.length)} vendas · ${fmt(BASE.futuras.length)} negociações futuras · leitura da planilha`
    : 'Aguardando a planilha…';
}
function render(){
  matar(); abas(); cabecalho(); barraBase();
  const naOrc = S.tab==='orc', naLit = S.tab==='lorc'||S.tab==='lprecos'; $('#orc-host').hidden=!naOrc; $('#lit-host').hidden=!naLit; $('#main').hidden=naOrc||naLit;
  if(naLit){ if(!LIT_FR){ if(!montaLit.rodando){ montaLit.rodando=true; montaLit($('#lit-host')).finally(()=>{montaLit.rodando=false;}); } } else { litAltura(); litModo(); } return; }
  if(naOrc){ if(!ORC_FR){ if(!montaOrc.rodando){ montaOrc.rodando=true; montaOrc($('#orc-host')).finally(()=>{montaOrc.rodando=false;}); } } else orcAltura(); return; }
  if(!pronto){
    $('#main').innerHTML = `<div class="card"><div class="empty">${ARQ.lendo? 'Lendo a planilha…' :
      'Clique em <b>Escolher planilha</b> acima e aponte o arquivo CONTROLE - VENDAS.xlsx. O app lê os números e se atualiza sempre que você salvar a planilha.'}</div></div>`;
    return;
  }
  (VIEWS[S.tab]||viewFaturamento)(); ajustaFcols();
}
{ const h=(location.hash||'').slice(1).split('/'); const [l,t]= h.length>1? h : [Object.keys(TABS_LINHA).find(k=>TABS_LINHA[k].some(x=>x[0]===h[0])), h[0]];
  if(TABS_LINHA[l] && TABS_LINHA[l].some(x=>x[0]===t)){ S.linha=l; S.tab=t; S.tabL[l]=t; } }
render();
const rr=()=>render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rr);
new MutationObserver(rr).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
iniciar();
{const t=$('#b-tema .tx'); if(t) t.textContent=escuro()?'Claro':'Escuro';}

})();
