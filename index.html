<style>
/* Faixa de marca no topo, abas por assunto, conteúdo em cartões sobre fundo rosado. Painel operacional da Movimenta. */
:root{
  --bg:#FBF8FA; --panel:#FFFFFF; --ink:#2A2230; --muted:#6E6573; --line:#E7D3DF;
  --mag:#A44C7E; --mag-2:#8C3A68; --mag-soft:#F6EAF1;
  --sun:#F2B540; --sky:#8DB6C9; --clay:#D9704A;
  --field:#FFFFFF; --field-line:#D9CCD5; --ok:#2F7D5B; --ok-forte:#1E6A47; --warn:#B4532A; --bad:#B4322A;
  --grid:#EFE6EC; --axis:#D9CCD5; --wash:rgba(164,76,126,.07); --plate:#FFFFFF;
  --disp:"Outfit",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1519; --panel:#251D23; --ink:#F1E9EE; --muted:#B5A7B0; --line:#4A3542;
  --mag:#D07AAA; --mag-2:#E197BE; --mag-soft:#3A2432;
  --field:#1F181D; --field-line:#4D3C47; --ok:#6CC59B; --ok-forte:#8FE0B8; --warn:#F09A70; --bad:#F08A80;
  --grid:#352A31; --axis:#4A3542; --wash:rgba(208,122,170,.12); --plate:#F5EFF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1519; --panel:#251D23; --ink:#F1E9EE; --muted:#B5A7B0; --line:#4A3542;
  --mag:#D07AAA; --mag-2:#E197BE; --mag-soft:#3A2432;
  --field:#1F181D; --field-line:#4D3C47; --ok:#6CC59B; --ok-forte:#8FE0B8; --warn:#F09A70; --bad:#F08A80;
  --grid:#352A31; --axis:#4A3542; --wash:rgba(208,122,170,.12); --plate:#F5EFF2; color-scheme:dark}
*{box-sizing:border-box}
.pizza{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pizza svg{width:190px;height:190px;flex:none}
.pz-t{font-family:var(--disp);font-weight:600;font-size:15px;fill:var(--ink)}.pz-s{font-size:10px;fill:var(--muted)}
.pz-leg{list-style:none;margin:0;padding:0;flex:1;min-width:200px;display:grid;gap:5px}
.pz-leg li{display:grid;grid-template-columns:12px 1fr auto 52px;gap:8px;align-items:center;font-size:13px}
.pz-leg b{font-variant-numeric:tabular-nums;font-weight:600}.pz-p{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.pz-h{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:600}
.ed-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ed-card{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ed);border-radius:12px;padding:12px 14px;cursor:pointer}
.ed-card:hover{background:var(--wash)}.ed-card.on{box-shadow:0 0 0 2px var(--ed) inset}
.ed-top{display:flex;align-items:center;gap:8px;font-family:var(--disp)}.ed-top .ed-n{margin-left:auto;color:var(--muted);font-size:12px}
.ed-dot{width:9px;height:9px;border-radius:50%;background:var(--ed)}
.ed-v{font-family:var(--disp);font-size:22px;font-weight:600;margin:6px 0 8px}.ed-v small{font-size:12px;color:var(--muted);font-weight:400}
.ed-barra{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--grid)}
.ed-barra i,.ed-leg i{display:block}.ed-barra .ok,.ed-leg .ok,.est-pill.ok{background:var(--ok)}.ed-barra .bx,.ed-leg .bx{background:var(--sun)}.ed-barra .sm,.ed-leg .sm{background:var(--bad)}
.ed-leg{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--muted)}.ed-leg span{display:flex;align-items:center;gap:5px}.ed-leg i{width:8px;height:8px;border-radius:2px}
.est-pill{display:inline-block;min-width:54px;text-align:center;padding:3px 10px;border-radius:99px;font-weight:600;font-size:12.5px;color:#fff}
.est-pill.baixo{background:var(--sun);color:#3a2a00}.est-pill.sem{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:500}
.ed-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}.ed-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ed)}
table.est-lit .sub-a{display:block;font-size:12px;color:var(--muted);font-weight:400}
table.est-lit tr.s-sem td{background:color-mix(in srgb,var(--bad) 5%,transparent)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
details.fora{margin-top:14px}details.fora summary{cursor:pointer;color:var(--muted);font-size:13px}
#orc-host,#lit-host{padding-top:4px}
.orc-fr{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.ms{position:relative;min-width:120px}
.legend .sw,.pz-leg .sw{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.12))}
.fcols{display:grid;margin:0 0 10px;padding-left:1px}
.fcols-vazio{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin:0 0 12px}.fcols-vazio>div{flex:0 1 200px;min-width:140px}
th.thf{overflow:visible}
th #csv{min-height:26px;padding:2px 8px;font-size:11.5px;letter-spacing:0;text-transform:none;white-space:nowrap}
th.thf .ms{position:static;min-width:0;display:inline-block;gap:0}
th.thf .ms>span:first-child{display:none}
th.thf .ms-btn{display:inline-flex;align-items:center;gap:5px;width:auto;min-height:0;padding:2px 0;border:0;background:none;box-shadow:none;border-radius:0;
  font:inherit;font-family:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer}
th.thf .ms-btn .ms-tx{display:none}
th.thf .ms-btn svg{width:10px;height:10px;opacity:.75}
th.thf .ms-btn:hover,th.thf .ms-btn[aria-expanded="true"]{color:var(--ink)}
th.thf .ms-btn.ativo{text-decoration:underline;text-underline-offset:3px}
th.thf .ms-btn.ativo{color:var(--mag);box-shadow:none}
th.thf .ms-btn.ativo::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--mag)}
th.thf .ms-pop{position:fixed;text-transform:none;letter-spacing:0;font-weight:400;font-size:13.5px;text-align:left;white-space:normal}
.fcols>div{padding:0 8px;min-width:0}.fcols>div:first-child{padding-left:8px}
.fcols .ms{min-width:0;width:100%}.fcols .ms-btn .ms-tx{max-width:100%}.fcols select{width:100%}
.fcols .f>input,.fcols .f>select{width:100%}
.fbusca{display:flex;gap:10px 12px;align-items:end;margin-bottom:10px;padding:0 8px}.fbusca .grow{flex:1 1 220px}
table.alinhada{table-layout:fixed;width:100%}
table.alinhada td.l:not(.wrap-t){overflow:hidden;text-overflow:ellipsis}
table.alinhada td.wrap-t{min-width:0}
.filters.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px 12px}
.filters.fgrid .f{min-width:0}.filters.fgrid .f.l2{grid-column:span 2}.filters.fgrid .f.full{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;gap:10px 16px;align-items:end}
.filters.fgrid .f.full>.f{min-width:0}
@media (max-width:760px){.fcols{display:flex;flex-wrap:wrap;gap:10px;padding:0!important}.fcols>div{padding:0;flex:1 1 140px}.fbusca{padding:0;flex-wrap:wrap}
  table.alinhada{table-layout:auto;min-width:760px}.filters.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ms-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:36px;padding:7px 9px;font:inherit;font-family:var(--body);color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:7px;cursor:pointer;text-align:left}
.ms-btn .ms-tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.ms-btn svg{width:12px;height:12px;flex:none;color:var(--muted)}
.ms-btn.ativo{border-color:var(--mag);box-shadow:inset 0 0 0 1px var(--mag)}
.ms-pop{position:absolute;top:100%;left:0;margin-top:4px;z-index:35;min-width:230px;max-width:min(340px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(42,34,48,.16);padding:6px}
.ms-acoes{display:flex;justify-content:space-between;gap:8px;padding:4px 6px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ms-acoes button{background:none;border:0;padding:2px 0;font:600 12.5px var(--body);color:var(--mag);cursor:pointer}
.ms-lista{max-height:300px;overflow:auto}
.ms-busca{width:100%;min-height:32px;margin:0 0 6px;padding:5px 8px;font:inherit;font-size:13.5px;border:1px solid var(--field-line);border-radius:6px;background:var(--field);color:var(--ink)}

.mk b{display:block;font-size:17px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.mk .ok b{color:var(--ok)} .mk .bad b{color:var(--bad)} .mk .hl{background:var(--mag-soft);border-color:transparent} .mk .hl b{color:var(--mag)}
.barra{height:10px;border-radius:6px;background:var(--wash,#eee);overflow:hidden;display:flex;margin:2px 0 4px}
.barra i{display:block;height:100%;background:var(--ok)} .barra i+i{background:var(--bad);opacity:.35}
.barra-leg{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
table.atd td,table.atd th{white-space:nowrap;padding:5px 7px}
.mk span.selo{display:inline-block;font-size:12px;letter-spacing:0;text-transform:none;color:#fff}.mk span.selo.s-par{color:#4a2a00}
table.atd td.ok{color:var(--ok)} table.atd td.bad{color:var(--bad);font-weight:600}
table.atd tr.sub td{font-weight:600;background:var(--wash,transparent)}
table.atd tr.sub td.bad,table.atd tr.tot td.bad{color:var(--bad)}
table.atd td.ok2,table.atd tr.sub td.ok2,table.atd tr.tot td.ok2{color:var(--ok-forte,#1E6A47);font-weight:600}
table.atd th.sep,table.atd td.sep{border-left:1px solid var(--line)}
@media (max-width:600px){.mk b{font-size:14px;white-space:normal;overflow:visible}}
.pubform{display:flex;flex-direction:column;gap:10px}
.pubform label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pubform input{font:inherit;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--field);border:1px solid var(--field-line);border-radius:7px;padding:8px 10px}
.publog{margin:12px 0 0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.publog .ok{color:var(--ok)} .publog .warn{color:var(--warn)} .publog .err{color:var(--bad);font-weight:600}
.caixas{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin:6px 0 4px}
.caixa{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;background:var(--panel);min-width:0}
.caixa.inteira{grid-column:1/-1}
.caixa .ficha.linha{grid-template-columns:minmax(0,1.5fr) auto minmax(0,1fr) minmax(0,1.4fr)}
.caixa .ficha.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.caixa .ficha.linha{grid-template-columns:minmax(0,1fr) auto}}
.caixa h3{margin:0 0 10px!important;padding-bottom:8px;border-bottom:1px solid var(--line)}
.caixa .ficha{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.caixa.dest{background:var(--mag-soft);border-color:transparent}
.ficha{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.ficha div span{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ficha div b{font-weight:600;font-size:14px;overflow-wrap:anywhere}
body.modal-on{overflow:hidden}
@media (max-width:520px){.serie .linhas{grid-template-columns:1fr 72px 72px}.topo img{height:32px}}

.trava{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.trava-box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 36px rgba(0,0,0,.08)}
.trava-logo{height:44px;width:auto;align-self:flex-start;background:var(--plate);padding:4px 8px;border-radius:8px}
.trava-box h1{margin:6px 0 0;font-size:22px;color:var(--mag)}
.trava-sub{margin:0 0 6px;color:var(--muted);font-size:13px}
.trava-l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.trava-box input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--field-line);border-radius:8px;background:var(--field);color:var(--ink)}
.trava-c{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-size:13px;color:var(--ink);text-transform:none;letter-spacing:0}
.trava-c input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--mag)}
.trava-e{margin:0;color:var(--bad);font-size:13px}
</style>

<style>:root{color-scheme:light}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
.linhas{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel);gap:2px}
.linhas button{border:0;background:transparent;color:var(--muted);font:600 13.5px var(--disp);padding:7px 16px;border-radius:999px;cursor:pointer}
.linhas button[aria-pressed=true]{background:var(--mag);color:#fff}
.linhas button:not([aria-pressed=true]):hover{color:var(--ink);background:var(--wash)}
@media (max-width:520px){.linhas button{padding:6px 11px;font-size:12.5px}}
.tema-btn{margin-left:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 12.5px var(--body);cursor:pointer}
.tema-btn:hover{border-color:var(--mag);color:var(--mag)}
.tema-btn svg{width:16px;height:16px}
.tema-btn .ic-sol{display:none}
:root[data-theme="dark"] .tema-btn .ic-sol{display:inline}
:root[data-theme="dark"] .tema-btn .ic-lua{display:none}
@media (max-width:520px){.tema-btn .tx{display:none}}
</style>
</head>

    <h1 id="trava-t">Controle de Vendas</h1>
    <p class="trava-sub">Digite a senha que você recebeu para ver os números.</p>
    <label class="trava-l" for="trava-s">Senha</label>
    <input id="trava-s" type="password" autocomplete="current-password" required>
    <label class="trava-c"><input type="checkbox" id="trava-m" checked> Lembrar neste aparelho</label>
    <button class="btn primary" type="submit" id="trava-b">Entrar</button>
    <p class="trava-e" id="trava-e" hidden></p>
  </form>
</div>
<script>
window.__VIEWER={
  unlock(){ return new Promise(ok=>{
    const f=document.getElementById('trava-f'), si=document.getElementById('trava-s'), er=document.getElementById('trava-e'), bt=document.getElementById('trava-b');
    let arqs=null;
    const busca=async()=>{ if(arqs) return arqs; const t='?t='+Date.now(); arqs={};
      for(const n of ['base_completa','base_geral']){ try{ const r=await fetch(n+'.enc'+t,{cache:'no-store'}); if(r.ok) arqs[n]=await r.json(); }catch(e){} }
      return arqs; };
    const tenta=async(senha,lembrar)=>{
      bt.disabled=true; bt.textContent='Abrindo…'; er.hidden=true;
      try{ const a=await busca(); if(!a.base_completa && !a.base_geral) throw new Error('semdados');
        for(const n of ['base_completa','base_geral']){ if(!a[n]) continue;
          try{ const d=await CRIPTO.abre(a[n],senha);
            if(lembrar){ try{ localStorage.setItem('mvt-senha',senha); }catch(e){} }
            window.__SNAP=d; document.getElementById('trava').remove(); ok(); return; }catch(e){} }
        throw new Error('senha');
      }catch(e){ er.textContent = e.message==='semdados'? 'Ainda não há dados publicados. Tente de novo mais tarde.' : 'Senha incorreta. Confira e tente de novo.';
        er.hidden=false; try{ localStorage.removeItem('mvt-senha'); }catch(_){} }
      bt.disabled=false; bt.textContent='Entrar'; };
    f.addEventListener('submit',ev=>{ ev.preventDefault(); tenta(si.value, document.getElementById('trava-m').checked); });
    let salva=null; try{ salva=localStorage.getItem('mvt-senha'); }catch(e){}
    if(salva) tenta(salva,true); else si.focus();
  }); },
  sair(){ try{ localStorage.removeItem('mvt-senha'); }catch(e){} location.reload(); }
};
</script>

function grafico(id,spec){
  const el=$('#'+id); if(!el) return;

    const soma = i => sets.reduce((s,x)=>s+(x.data[i]||0),0);
    const mx = spec.stacked? Math.max(...spec.labels.map((_,i)=>soma(i))) : Math.max(...sets.flatMap(s=>s.data));
    const log = !!spec.log && !spec.stacked && mx>0;
    const top = log? Math.pow(10,Math.ceil(Math.log10(mx))) : topo(mx*1.02);
    const piso = 1;
    const ticks = log
      ? Array.from({length:Math.max(2,Math.round(Math.log10(top))+1)},(_,i)=>Math.pow(10,i)).filter(t=>t<=top)
      : [0,.25,.5,.75,1].map(f=>top*f);
    const tw=Math.max(...ticks.map(t=>vc(t).length))*6.6+12, hor=spec.kind==='hbar';
    const lw = hor? Math.min(170,Math.max(...spec.labels.map(l=>Math.min(String(l).length,24)))*7.2+18) : Math.ceil(tw);
    const m = hor? {l:lw,r:Math.max(54,tw*0.9),t:6,b:22} : {l:lw,r:12,t:spec.rotulos?22:10,b:24};
    const pw=W-m.l-m.r, ph=H-m.t-m.b; let g='';
    // visual encorpado: cada cor ganha um degradê (mais claro em cima / na ponta) e as barras uma sombra suave
    const gid={}, defs=[]; const grad=(c,dir)=>{ const k=c+'|'+dir; if(gid[k]) return gid[k]; const nm=id+'-g'+defs.length; gid[k]=nm;
      const [x2,y2]=dir==='h'?['100%','0']:['0','100%'];
      defs.push(`<linearGradient id="${nm}" x1="0" y1="0" x2="${x2}" y2="${y2}">${dir==='h'
        ? `<stop offset="0" style="stop-color:color-mix(in srgb,${c} 88%,#000)"/><stop offset="1" style="stop-color:color-mix(in srgb,${c} 72%,#fff)"/>`
        : dir==='a' ? `<stop offset="0" style="stop-color:${c};stop-opacity:.28"/><stop offset="1" style="stop-color:${c};stop-opacity:0"/>`
        : `<stop offset="0" style="stop-color:color-mix(in srgb,${c} 72%,#fff)"/><stop offset="1" style="stop-color:color-mix(in srgb,${c} 90%,#000)"/>`}</linearGradient>`);
      return nm; };
    defs.push(`<filter id="${id}-sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="${escuro()?.45:.16}"/></filter>`);
    const esc1 = v => log? (v<=piso? 0 : Math.log10(v)/Math.log10(top)) : v/top;
    const X=v=>m.l+esc1(v)*pw, Y=v=>m.t+ph-esc1(v)*ph, band=(hor?ph:pw)/n;
    if(!hor){
      ticks.forEach(t=>{g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t===0?ax:gr}"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end" fill="${ink2}" font-size="11">${vc(t)}</text>`;});
      if(spec.kind==='line'){
        sets.forEach(s=>{
          const pts=s.data.map((v,i)=>[m.l+band*(i+.5), Y(v||0)]);
          // na escala logarítmica, mês sem venda não tem ponto: a linha é interrompida ali
          let d='', ant=false; pts.forEach((p,i)=>{ const ok=!log||(s.data[i]>0); if(ok) d+=(ant?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); ant=ok; });
          if(K<=2 && !s.dash && !log){ const a=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')+`L${pts[pts.length-1][0].toFixed(1)} ${Y(0)}L${pts[0][0].toFixed(1)} ${Y(0)}Z`;
            g+=`<path d="${a}" fill="url(#${grad(s.color,'a')})"/>`; }
          g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round" filter="url(#${id}-sh)"${s.dash?' stroke-dasharray="5 4"':''}/>`;
          pts.forEach((p,i)=>{ if(s.data[i]) g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${s.color}" stroke="${pn}" stroke-width="2"/>`; });
        });
        spec.labels.forEach((lab,i)=>{ g+=`<text x="${m.l+band*(i+.5)}" y="${H-7}" text-anchor="middle" fill="${ink2}" font-size="11">${esc(lab)}</text>`; });
      } else {
      const bw=Math.min(band*.74,spec.stacked?46:34*K), sw=spec.stacked?bw:bw/K;
      spec.labels.forEach((lab,i)=>{const cx=m.l+band*(i+.5); let acc=0;
        sets.forEach((s,k)=>{const v=s.data[i]||0; if(!v) return;
          const x=spec.stacked? cx-bw/2 : cx-bw/2+k*sw;
          const y0=spec.stacked?Y(acc):Y(0), y1=spec.stacked?Y(acc+v):Y(v); acc+=v;
          g+=`<rect x="${x}" y="${y1}" width="${Math.max(sw-(spec.stacked?0:2),1)}" height="${Math.max(y0-y1,1)}" rx="3" fill="url(#${grad(s.color,'v')})" stroke="${pn}" stroke-width="${spec.stacked?1.5:0}" filter="url(#${id}-sh)"/>`;
          if(spec.rotulos && !spec.stacked && sw>=22) g+=`<text x="${x+sw/2-1}" y="${y1-5}" text-anchor="middle" fill="${ink}" font-size="${K>1?10:11}" font-weight="600">${vc(v)}</text>`;});
        g+=`<text x="${cx}" y="${H-7}" text-anchor="middle" fill="${ink2}" font-size="11">${esc(lab)}</text>`;});
      }
    } else {
      const step=(pw/4)<tw?2:1;
      ticks.forEach((t,ti)=>{g+=`<line y1="${m.t}" y2="${m.t+ph}" x1="${X(t)}" x2="${X(t)}" stroke="${t===0?ax:gr}"/>`;
        if(ti%step===0) g+=`<text x="${X(t)}" y="${H-7}" text-anchor="${ti===0?'start':ti===ticks.length-1?'end':'middle'}" fill="${ink2}" font-size="11">${vc(t)}</text>`;});
      const bh=Math.min(18,(band-7)/K);
      spec.labels.forEach((lab,i)=>{const cy=m.t+band*(i+.5);
        g+=`<text x="${m.l-8}" y="${cy+4}" text-anchor="end" fill="${ink2}" font-size="11.5">${esc(String(lab).length>24?String(lab).slice(0,23)+'…':lab)}</text>`;
        sets.forEach((s,k)=>{const v=s.data[i]||0, y=cy-K*bh/2+k*bh, w=Math.max(X(v)-m.l,v?2:0);
          g+=`<rect x="${m.l}" y="${y}" width="${w}" height="${bh-1.5}" rx="3" fill="url(#${grad(s.color,'h')})" filter="url(#${id}-sh)"/>`;
          if(v&&(K===1||bh>=9)) g+=`<text x="${m.l+w+5}" y="${y+bh/2+3.5}" fill="${K===1?ink:ink2}" font-size="${K===1?11:10}">${vc(v)}</text>`;});});
    }
    g+=`<g id="${id}-cr"></g>`;
    el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gráfico"><defs>${defs.join('')}</defs>${g}</svg>`; el.appendChild(tip);
    const svg=el.firstChild, cr=svg.querySelector('#'+id+'-cr');
    const mostra=e=>{const r=svg.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
      const i=Math.floor((hor?py-m.t:px-m.l)/band);
      if(i<0||i>=n){tip.hidden=true;cr.innerHTML='';return;}
      cr.innerHTML = hor? `<rect x="${m.l}" y="${m.t+band*i}" width="${pw}" height="${band}" fill="${ink2}" opacity=".07"/>`
                        : `<line x1="${m.l+band*(i+.5)}" x2="${m.l+band*(i+.5)}" y1="${m.t}" y2="${m.t+ph}" stroke="${ax}" stroke-dasharray="3 3"/>`;
      let h=`<b>${esc(spec.labels[i])}</b>`;
      sets.forEach(s=>{if(s.data[i]) h+=`<div><span class="sw" style="background:${s.color}"></span>${esc(s.label)}: <b>${vf(s.data[i])}</b></div>`;});
      if(spec.stacked&&K>1) h+=`<div class="tt">Total: <b>${vf(soma(i))}</b></div>`;
      tip.innerHTML=h; tip.hidden=false;
      tip.style.left=Math.min(Math.max(px+14,4),W-tip.offsetWidth-4)+'px';
      tip.style.top=Math.min(Math.max(py-tip.offsetHeight-10,4),H-tip.offsetHeight-4)+'px';};
    svg.addEventListener('pointermove',mostra); svg.addEventListener('pointerdown',mostra);
    svg.addEventListener('pointerleave',()=>{tip.hidden=true;cr.innerHTML='';});
  }
  pinta();
  const ro=new ResizeObserver(()=>{clearTimeout(ro.t); ro.t=setTimeout(pinta,60);}); ro.observe(el); obs.push(ro);
}

/* ---------------- leitura da planilha (.xlsx) ---------------- */
/* Um .xlsx é um ZIP de arquivos XML. Aqui ele é aberto no próprio navegador,
   sem biblioteca externa: descompacta com DecompressionStream e lê o XML com DOMParser. */
const u16 = (d,o)=> d[o]|d[o+1]<<8;
const u32 = (d,o)=> (d[o]|d[o+1]<<8|d[o+2]<<16|d[o+3]<<24)>>>0;
async function inflaRaw(buf){
  const fluxo = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(fluxo).arrayBuffer());
}
async function abreZip(ab){
  const d = new Uint8Array(ab);
  let fim = d.length-22;
  while(fim>=0 && u32(d,fim)!==0x06054b50) fim--;
  if(fim<0) throw new Error('zip');
  const n = u16(d,fim+10); let off = u32(d,fim+16); const saida = {};
  for(let i=0;i<n;i++){
    const nl=u16(d,off+28), el=u16(d,off+30), cl=u16(d,off+32);
    const local=u32(d,off+42), metodo=u16(d,off+10), comp=u32(d,off+20);
    const nome=new TextDecoder().decode(d.subarray(off+46,off+46+nl));
    const lnl=u16(d,local+26), lel=u16(d,local+28), ini=local+30+lnl+lel;
    const cru=d.subarray(ini,ini+comp);
    saida[nome] = metodo===0? cru : await inflaRaw(cru);
    off += 46+nl+el+cl;
  }
  return saida;
}
const txt = b => new TextDecoder().decode(b);
const xml = b => new DOMParser().parseFromString(txt(b),'application/xml');
const colNum = ref => { let n=0; for(const c of ref.replace(/\d+/g,'')) n=n*26+(c.charCodeAt(0)-64); return n-1; };
/* número de série do Excel -> data ISO (base 1900, com o salto do ano 1900) */
function dataExcel(n){
  if(!isFinite(n)||n<=0) return '';
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d)) return '';
  return d.toISOString().slice(0,10);
}
function lePlanilha(z, nomeAba){
  const wb = xml(z['xl/workbook.xml']);
  const rels = xml(z['xl/_rels/workbook.xml.rels']);
  const alvo = {};
  [...rels.getElementsByTagName('Relationship')].forEach(r=>alvo[r.getAttribute('Id')]=r.getAttribute('Target'));
  const aba = [...wb.getElementsByTagName('sheet')].find(s=>s.getAttribute('name')===nomeAba);
  if(!aba) return null;
  const rid = aba.getAttribute('r:id') || aba.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  const caminho = 'xl/' + String(alvo[rid]).replace(/^\/?xl\//,'').replace(/^\//,'');
  const dados = z[caminho] || z['xl/'+alvo[rid]];
  if(!dados) return null;
  const doc = xml(dados);
  const linhas = [...doc.getElementsByTagName('row')];
  return linhas.map(r=>{
    const saida = [];
    [...r.getElementsByTagName('c')].forEach(c=>{
      const i = colNum(c.getAttribute('r')||'A1');
      const t = c.getAttribute('t');
      if(t==='inlineStr'){ saida[i]=c.textContent; return; }
      const v = c.getElementsByTagName('v')[0];
      if(!v){ saida[i]=''; return; }
      saida[i] = t==='s'? SST[+v.textContent] : (t==='str'||t==='e')? v.textContent : +v.textContent;
    });
    return saida;
  });
}
let SST = [];
function leSST(z){
  if(!z['xl/sharedStrings.xml']){ SST=[]; return; }
  const doc = xml(z['xl/sharedStrings.xml']);
  SST = [...doc.getElementsByTagName('si')].map(si=>{
    const ts=[...si.getElementsByTagName('t')];
    return ts.map(t=>t.textContent).join('');
  });
}

const SERIES_PLAN = [['01 ANO','EI1'],['02 ANOS','EI2'],['03 ANOS','EI3'],['04 ANOS','EI4'],['05 ANOS','EI5'],
  ['1º ANO','AI1'],['2º ANO','AI2'],['3º ANO','AI3'],['4º ANO','AI4'],['5º ANO','AI5'],
  ['6º ANO','AF6'],['7º ANO','AF7'],['8º ANO','AF8'],['9º ANO','AF9'],
  ['1º MÉDIO','EM1'],['2º MÉDIO','EM2'],['3º MÉDIO','EM3']];
const CODSER = {}; SERIES_PLAN.forEach(([r,c])=>CODSER[r]=c);
const cabeca = c => String(c==null?'':c).split(' - ')[0].trim();
const limpa = v => v==null? '' : String(v).trim();
const numero = v => { const n=+v; return isFinite(n)? n : 0; };

function indices(cab){
  const ix={}; cab.forEach((c,i)=>{ const k=limpa(c); if(k && !(k in ix)) ix[k]=i; });
  return ix;
}
function serie(linha, cab, de, ate){
  const s={};
  for(let i=de;i<ate;i++){
    const cod = CODSER[cabeca(cab[i])];
    const q = numero(linha[i]);
    if(cod && q) s[cod] = (s[cod]||0) + q;
  }
  return s;
}
const somaSer = o => Object.values(o||{}).reduce((a,b)=>a+(+b||0),0);
function converteVendas(linhas){

  const ix = indices(cab);
  const iA = cab.indexOf('01 ANO - ALUNOS - ALUNOS'), iAcv = cab.indexOf('ACERVO - - ALUNO');
  const iP = cab.indexOf('01 ANO - PROFESSOR - PROFESSOR'), iPf = cab.indexOf('3º MÉDIO -  - PROFESSOR');
  const saida = [];
  for(let r=1;r<linhas.length;r++){

      pagamento: typeof pag==='number' && pag>20000? dataExcel(pag) : limpa(pag),
      desconto: numero(L[ix['DESC.']]), valor: numero(L[ix['VALOR']]),

      kitsAluno: somaSer(serA) + acervo, kitsProf: somaSer(serP),

      acervo, serA, serP
    });
  }
  return saida;
}
function converteFuturas(linhas){
  const cab = linhas[0].map(limpa);
  const ix = indices(cab);
  const iA = cab.indexOf('01 ANO - ALUNOS'), iP = cab.indexOf('01 ANO - PROFESSOR - PROFESSOR'), iF = cab.indexOf('ALUNO EI');
  const saida = [];
  for(let r=1;r<linhas.length;r++){
    const L = linhas[r]; if(!L || !limpa(L[ix['PROJETO']])) continue;
    const uf = limpa(L[ix['UF']]).toUpperCase();
    const d = dataExcel(numero(L[ix['ANO']]));
    const serA = serie(L,cab,iA,iP), serP = serie(L,cab,iP,iF);
    const soma = o => Object.values(o).reduce((a,b)=>a+b,0);
    saida.push({
      id:'f'+r, mesPrevisto: d? d.slice(0,7) : '',
      regiao: REG[uf] || limpa(L[ix['REGIÃO']]), uf,
      rede: limpa(L[ix['REDE']]), via: limpa(L[ix['DISTRIBUIDOR']]), projeto: limpa(L[ix['PROJETO']]),
      serA, serP, kitsAluno: soma(serA), kitsProf: soma(serP),
      valor: numero(L[ix['FATURAMENTO TOTAL']]),
      fatAluno: numero(L[ix['FATURAMENTO ALUNO']]), fatProf: numero(L[ix['FATURAMENTO PROFESSOR']])
    });
  }

}
function converteLista(linhas){
  return (linhas||[]).map(l=>limpa(l[0])).filter(Boolean);
}
function convertePrecos(linhas){
  if(!linhas||!linhas.length) return [];
  const cab = linhas[0].map(limpa);
  const pos = {};
  cab.forEach((c,i)=>{ const m=c.match(/^(EI|AI|AF|EM)\s*-\s*(ALUNO|PROFESSOR)$/i);
    if(m) pos[m[1].toUpperCase()+'_'+(m[2].toUpperCase()==='ALUNO'?'aluno':'prof')]=i; });
  const saida=[];
  for(let r=1;r<linhas.length;r++){
    const L=linhas[r]; const nome=limpa(L[0]); if(!nome) continue;
    const o={projeto:nome, mult: MULT[nome]||1};
    Object.entries(pos).forEach(([k,i])=>o[k]=numero(L[i]));
    saida.push(o);
  }
  return saida;
}

async function interpretaCenso(file){
  const z = await abreZip(await file.arrayBuffer()); leSST(z);
  const nome = [...xml(z['xl/workbook.xml']).getElementsByTagName('sheet')].map(x=>x.getAttribute('name')).find(n=>/^MATRICULA/.test(SEMACENTO(n)));
  const L = nome? (lePlanilha(z,nome)||[]) : []; SST=[];

  const m = titulo.match(/Censo Escolar\s*\d{4}(\s*\(Inep\))?/i);
  const hi = L.findIndex(r=>r && r.some(c=>SEMACENTO(c).trim()==='MUNICIPIO'));
  if(hi<0) throw new Error('censo');
  const cab = L[hi].map(c=>SEMACENTO(c).trim()), iU=cab.indexOf('UF'), iM=cab.indexOf('MUNICIPIO'), iR=cab.indexOf('REDE'), i0=cab.indexOf('CRECHE');
  const mapa = new Map();
  for(const r of L.slice(hi+1)){ if(!r||!limpa(r[iM])) continue;
    const k = limpa(r[iU])+'|'+limpa(r[iM]); if(!mapa.has(k)) mapa.set(k,[limpa(r[iU]),limpa(r[iM]),...Array(28).fill(0)]);
    const o = /^EST/.test(SEMACENTO(r[iR]))? 14 : 0, a = mapa.get(k);
    for(let j=0;j<14;j++) a[2+o+j] = Math.round(numero(r[i0+j])||0); }
  if(!mapa.size) throw new Error('censo');
  return {linhas:[...mapa.values()], rotulo: m? (m[0].replace(/\s+/g,' ')+(m[1]?'':' (Inep)')) : 'Censo Escolar', arquivo:file.name, modificado:file.lastModified};
}

const PROJ_TAB = [['ABRE','17 - ABRE PALAVRA','abre'],['MAJOG','02 - MAJOG','majog'],['SARACOTEIO','18 - SARACOTEIO','saracoteio'],
  ['BANCO','03 - BANCO+','banco'],['VIDA','06 - VIDA','vida'],['VV','05 - VV','voz'],['STP','04 - STP','stp'],['LIGA','07 - LIGA','liga'],

async function interpretaTabelaProjetos(file){
  const z = await abreZip(await file.arrayBuffer()); leSST(z);
  const abas = [...xml(z['xl/workbook.xml']).getElementsByTagName('sheet')].map(x=>x.getAttribute('name'));
  const proj = {}, gerador = {};
  for(const aba of abas){
    const nm = SEMACENTO(aba).replace(/^[\d\s-]+/,'').trim();
    const m = PROJ_TAB.find(x=>nm.startsWith(x[0])); if(!m) continue;
    let seg = null; const t = {};
    for(const r of (lePlanilha(z,aba)||[])){
      if(!r) continue; const a = SEMACENTO(r[0]).trim(), pr = r[3];
      if(typeof pr!=='number' || !String(r[1]==null?'':r[1]).trim()){
        if(/INFANTIL/.test(a)) seg='EI'; else if(/INICIAIS/.test(a)) seg='AI'; else if(/FINAIS/.test(a)) seg='AF'; else if(/MEDIO/.test(a)) seg='EM';
        continue;
      }
      if(!seg) continue;
      const papel = /SALA/.test(a)?'sala' : /ESCOLA/.test(a)?null : /PROF/.test(a)?'prof' : /ALUNO/.test(a)?'aluno' : null;
      if(papel && !(t[seg]&&t[seg][papel])) (t[seg]=t[seg]||{})[papel] = pr;
    }
    if(Object.keys(t).length){ proj[m[1]] = t; gerador[m[2]] = t; }
  }
  SST = [];
  if(!Object.keys(proj).length) throw new Error('tabela');
  return {proj, gerador, arquivo:file.name, modificado:file.lastModified};

/* aluno = kit/livro do aluno; professor = professor + kit sala de aula (como na T_PREÇOS) */
function aplicaTabelaProjetos(base, tab){
  Object.entries(tab.proj).forEach(([nome,t])=>{
    let o = base.precos.find(p=>p.projeto===nome);
    if(!o){ o = {projeto:nome, mult: MULT[nome]||1}; base.precos.push(o); }
    Object.entries(t).forEach(([seg,v])=>{ o[seg+'_aluno'] = v.aluno||0; o[seg+'_prof'] = (v.prof||0)+(v.sala||0); });
    o.fonte = 'tabela';
  });
}
/* Faturamento das vendas futuras calculado no app: kits × preço de tabela × (1 − 77,5%).
   É a mesma conta da planilha, mas feita aqui — assim o valor aparece mesmo quando o Excel
   está em cálculo manual e a planilha foi salva sem apertar F9. */
function recalculaFuturas(base){
  const tab = new Map(base.precos.map(p=>[p.projeto,p]));
  base.futuras.forEach(f=>{
    const p = tab.get(f.projeto);
    f.valorPlan = f.valor; f.fatAlunoPlan = f.fatAluno; f.fatProfPlan = f.fatProf;
    if(!p) return;                                          // projeto sem preço: fica o valor da planilha
    const conta = (ser,tipo) => Object.entries(ser||{}).reduce((a,[c,q])=>a+(+q||0)*(p[c.slice(0,2)+'_'+tipo]||0),0)*(1-DESC_TABELA);
    f.fatAluno = +conta(f.serA,'aluno').toFixed(2);
    f.fatProf  = +conta(f.serP,'prof').toFixed(2);
    f.valor    = +(f.fatAluno + f.fatProf).toFixed(2);
  });
}

/* Os kits vêm descritos em texto livre. Aqui cada linha é classificada por
   projeto, público (aluno ou professor) e ano de escolaridade. */
const SEMACENTO = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const PROJ_ESTOQUE = [   // trecho do nome na planilha de estoque -> projeto do ERP
  ['TESOURO LITERARIO','14 - TL'], ['PROJETO INTEGRADO ARANDU','20 - ARANDU'],
  ['SARACOTEIO','18 - SARACOTEIO'], ['ABRE PALAVRA','17 - ABRE PALAVRA'],
  ['PROJETO VIDA','06 - VIDA'], ['MAJOG','02 - MAJOG'], ['LIGA','07 - LIGA'],
  ['PALAVRA CANTADA NA ESCOLA','01 - PCE'], ['COLCHA DE LEITURAS','16 - COLCHA'],
  ['MOTRIZ','08 - MOTRIZ'], ['SEU AMANHA','19 - SEU AMANHÃ'],
  ['SAO TANTAS PERGUNTAS','04 - STP'], ['BANCO MAIS','03 - BANCO+'], ['BANCO+','03 - BANCO+'],
  ['A VOZ E A VEZ','05 - VV'],
  ['LITERARIO','14 - TL']   // "LITERÁRIO" solto entra como Tesouro Literário
];
function publicoDoKit(u){
  if(u.indexOf('INSUMO') >= 0) return 'insumo';
  if(u.indexOf('SALA DE AULA') >= 0) return 'sala';
  if(u.indexOf('PROFESSOR') >= 0 || u.indexOf('EDUCADOR') >= 0) return 'professor';
  if(u.indexOf('ALUNO') >= 0 || u.indexOf('ESTUDANTE') >= 0 || u.indexOf('CRIANCA') >= 0) return 'aluno';
  return '';
}
function serieDoKit(u){
  // "3º ANO", "3O. ANO", "1ª SERIE" (com ordinal) ou texto de fundamental/médio = ano escolar;
  // "3 ANOS", "04 ANOS", "1 ANO" (sem ordinal) = idade, educação infantil
  // Seu Amanhã vem por curso: Curso 1 = 1ª série do médio, Curso 2 = 3ª série
  if(u.indexOf('SEU AMANHA') >= 0){ const c=u.match(/CURSO\s*(\d)/); if(c) return c[1]==='1'? 'EM1' : c[1]==='2'? 'EM3' : ''; }
  const medio = u.indexOf('MEDIO') >= 0, fund = u.indexOf('FUNDAMENTAL') >= 0;
  let m = u.match(/(\d)\s*(?:º|°|ª|O\.?|A\.)\s*\.?\s*(?:ANO|SERIE)/);
  if(!m && (medio || fund)) m = u.match(/(\d)\s*\.?\s*(?:ANO|SERIE)/);
  if(m){
    const n = +m[1];
    if(medio) return 'EM'+n;
    return (n<=5? 'AI':'AF')+n;
  }
  m = u.match(/(\d)\s*ANOS?/);
  return m? 'EI'+m[1] : '';
}
async function interpretaEstoque(file){
  const z = await abreZip(await file.arrayBuffer());
  leSST(z);
  const wb = xml(z['xl/workbook.xml']);
  const nomes = [...wb.getElementsByTagName('sheet')].map(s=>s.getAttribute('name'));
  let linhas = null;
  for(const nome of nomes){
    const L = lePlanilha(z, nome);
    if(!L) continue;
    const cab = L.findIndex(r => r && r.some(c=>limpa(c).toUpperCase()==='EM ESTOQUE'));
    if(cab >= 0){ linhas = L.slice(cab); break; }
  }
  SST = [];
  if(!linhas) throw new Error('A planilha não tem uma coluna "Em estoque".');
  const cab = linhas[0].map(c=>limpa(c).toUpperCase());
  const iDesc = cab.indexOf('DESCRIÇÃO')>=0? cab.indexOf('DESCRIÇÃO') : cab.indexOf('DESCRICAO');
  const iItem = cab.indexOf('ITEM');
  const iQtd = cab.indexOf('EM ESTOQUE');
  const iCont = cab.indexOf('CONTAGEM FÍSICA')>=0? cab.indexOf('CONTAGEM FÍSICA') : cab.indexOf('CONTAGEM FISICA');
  const itens = [], soltos = [], livros = [], cods = {};
  for(let r=1;r<linhas.length;r++){
    const L = linhas[r]; if(!L) continue;
    const desc = limpa(L[iDesc>=0? iDesc : iItem]);
    if(!desc) continue;
    { const k = (iItem>=0? limpa(L[iItem]) : '') || desc; cods[k] = (cods[k]||0) + numero(L[iQtd]); }
    const u = SEMACENTO(desc);
    const isbn = iItem>=0? limpa(L[iItem]).replace(/[^0-9X]/gi,'') : '';
    // Banco Mais e VV vêm como "PROJETO DO ALUNO/PROFESSOR", sem a palavra KIT — e com código ISBN,
    // por isso são reconhecidos antes de separar os livros avulsos
    const kitSemNome = (u.indexOf('BANCO MAIS')>=0 || u.indexOf('A VOZ E A VEZ')>=0) && u.indexOf('PROJETO DO')>=0;
    if(/^97[89]\d{10}$/.test(isbn) && u.indexOf('KIT')<0 && !kitSemNome){ livros.push({isbn, titulo:desc, qtd:numero(L[iQtd])}); continue; }
    if(u.indexOf('KIT') < 0 && !kitSemNome) continue;          // só kits de projeto
    const qtd = numero(L[iQtd]);
    const cont = iCont>=0 && L[iCont]!=='' && L[iCont]!=null ? numero(L[iCont]) : null;
    const projeto = (PROJ_ESTOQUE.find(p=>u.indexOf(p[0])>=0)||[])[1] || '';
    const publico = publicoDoKit(u), serie = serieDoKit(u);
    const linha = {desc, item: iItem>=0? limpa(L[iItem]) : '', projeto, publico, serie, qtd, cont};
    if(projeto && serie && (publico==='aluno'||publico==='professor')) itens.push(linha);
    else soltos.push(linha);
  }
  return {itens, soltos, livros, cods, arquivo:file.name, modificado:file.lastModified, lidoEm:Date.now()};
}

function idbAbre(){
  return new Promise((ok,erro)=>{ const r=indexedDB.open('movimenta-erp',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>erro(r.error); });
}
async function kv(acao,chave,valor){
  try{

    return await new Promise((ok,erro)=>{
      const t=db.transaction('kv', acao==='get'?'readonly':'readwrite'), s=t.objectStore('kv');
      const r = acao==='get'? s.get(chave) : s.put(valor,chave);
      r.onsuccess=()=>ok(r.result); r.onerror=()=>erro(r.error);
    });
  }catch(e){ return null; }
}

    if(p==='granted') await leArquivo(await ARQ.handle.getFile());
    else { ARQ.erro='Permissão negada para o arquivo.'; render(); }
  }catch(e){ ARQ.erro='Não foi possível reabrir o arquivo.'; render(); }
}
/* ---------------- pasta-fonte ----------------
   O app aponta para a pasta CLAUDE, organizada assim:
     1 - FONTES\  VENDAS - Controle.xlsx · ESTOQUE - NetSuite.xlsx · LITERATURA - Catalogo.xlsx · LITERATURA - Clientes.xlsx
     3 - APP\     visualizacao.html e base_vendas.json (gerados pelo Publicar base)
   Ainda aceita a organização antiga (uma pasta só com CONTROLE - VENDAS.xlsx e o estoque).
   Novo relatório de estoque: substitua o ESTOQUE - NetSuite.xlsx (ou salve o novo com qualquer nome e apague o anterior). */
const PASTA = {handle:null, nome:''};
const temPasta = typeof window.showDirectoryPicker === 'function';
const ehArqVendas = n => /^(VENDAS\s*-\s*CONTROLE|CONTROLE\s*-\s*VENDAS).*\.xls[xm]$/i.test(n);
const ehOutraFonte = n => /^(LITERATURA|PROJETOS)\s*-/i.test(n);
async function subPasta(nome){ try{ return await PASTA.handle.getDirectoryHandle(nome); }catch(e){ return null; } }
async function dirFontes(){ return (await subPasta('1 - FONTES')) || PASTA.handle; }
async function dirApp(){ return (await subPasta('3 - APP')) || PASTA.handle; }
async function arquivosDaPasta(){
  const out=[], dir=await dirFontes();
  for await (const [nome,h] of dir.entries()){
    if(h.kind!=='file' || nome.startsWith('~$') || !/\.xls[xm]$/i.test(nome)) continue;
    out.push(h);
  }
  return out;
}
async function permissaoPasta(pedir){
  if(!PASTA.handle) return false;
  let p = await PASTA.handle.queryPermission({mode:'read'});
  if(p!=='granted' && pedir) p = await PASTA.handle.requestPermission({mode:'read'});
  return p==='granted';
}
async function carregaVendasDaPasta(){
  try{
    const h=(await arquivosDaPasta()).find(x=>ehArqVendas(x.name));
    if(!h){ ARQ.erro='Não encontrei a planilha VENDAS - Controle.xlsx em '+PASTA.nome+(PASTA.nome==='CLAUDE'?'\\1 - FONTES':'')+'. Escolha a pasta CLAUDE.'; render(); return; }
    const arqs=await arquivosDaPasta();
    const ht=arqs.find(x=>/^PROJETOS\s*-\s*TABELA/.test(SEMACENTO(x.name)));
    if(ht){ try{ TABP = await interpretaTabelaProjetos(await ht.getFile()); kv('put','tabproj',TABP).catch(()=>{}); }catch(e){ /* fica a T_PREÇOS */ } }
    const hz=arqs.find(x=>/^PROJETOS\s*-\s*CENSO/.test(SEMACENTO(x.name)));
    if(hz){ try{ CENSOF = await interpretaCenso(await hz.getFile()); kv('put','censo',CENSOF).catch(()=>{}); ORC_FR=null; }catch(e){} }
    const hc=arqs.find(x=>/^PROJETOS\s*-\s*COMPOSI/.test(SEMACENTO(x.name)));
    if(hc){ try{ COMP = await interpretaComposicao(await hc.getFile()); kv('put','comp',COMP).catch(()=>{}); }catch(e){} }
    ARQ.handle=h; ARQ.nome=h.name; await leArquivo(await h.getFile());
    await carregaLitDaPasta();
  }catch(e){ ARQ.erro='Não consegui ler a pasta '+PASTA.nome+'.'; render(); }
}
async function carregaEstoqueDaPasta(){
  ARQE.lendo=true; ARQE.erro=''; render();
  try{
    const hs=(await arquivosDaPasta()).filter(x=>!ehArqVendas(x.name) && !ehOutraFonte(x.name));
    const fs=await Promise.all(hs.map(async h=>({h, f:await h.getFile()})));
    // primeiro o ESTOQUE - …; depois, o mais recente
    fs.sort((a,b)=>(/^ESTOQUE/i.test(b.h.name)-/^ESTOQUE/i.test(a.h.name)) || (b.f.lastModified-a.f.lastModified));
    for(const {h,f} of fs){
      try{
        EST = await interpretaEstoque(f);
        ARQE.handle=h; ARQE.nome=h.name; ARQE.estado='ok'; ARQE.lendo=false;
        kv('put','estoque',EST).catch(()=>{}); litInvalida(); render(); return;
      }catch(e){ /* não é a planilha de estoque: tenta a próxima */ }
    }
    ARQE.erro='Não encontrei a planilha de estoque (com a coluna "Em estoque") na pasta '+PASTA.nome+'.';
  }catch(e){ ARQE.erro='Não consegui ler a pasta '+PASTA.nome+'.'; }
  ARQE.lendo=false; render();
}
async function escolherPasta(){
  try{
    const h = await window.showDirectoryPicker({id:'movimenta-fonte', mode:'read'});
    PASTA.handle=h; PASTA.nome=h.name; await kv('put','fonte-dir',h);
    ARQ.erro=''; await carregaVendasDaPasta(); await carregaEstoqueDaPasta();
  }catch(e){ if(e&&e.name!=='AbortError'){ ARQ.erro='Não foi possível abrir a pasta.'; render(); } }
}
async function atualizaFonte(){
  if(!PASTA.handle) return escolherPasta();
  if(!(await permissaoPasta(true))){ ARQ.erro='Permissão negada para a pasta '+PASTA.nome+'.'; render(); return; }
  ARQ.erro=''; await carregaVendasDaPasta();
  if(ARQE.estado!=='ok') await carregaEstoqueDaPasta();
}
async function atualizaEstoque(){
  if(!PASTA.handle) return escolherPasta();
  if(!(await permissaoPasta(true))){ ARQE.erro='Permissão negada para a pasta '+PASTA.nome+'.'; render(); return; }
  await carregaEstoqueDaPasta();
}
async function religaPasta(){
  const h = await kv('get','fonte-dir'); if(!h) return false;
  PASTA.handle=h; PASTA.nome=h.name;
  try{
    if(await permissaoPasta(false)){ await carregaVendasDaPasta(); await carregaEstoqueDaPasta(); }
    else { ARQ.estado='aguardando'; ARQ.nome=ARQ.nome||'CONTROLE - VENDAS.xlsx'; if(EST) ARQE.estado='aguardando'; render(); }
  }catch(e){ ARQ.estado='aguardando'; render(); }
  return true;
}

/* ---------------- publicar base (versão de visualização) ----------------
   1) grava base_vendas.json na pasta-fonte (cópia completa, sem criptografia);
   2) gera duas cópias criptografadas — base_completa.enc (com pagamentos) e base_geral.enc (sem) —,
      cada uma com a sua senha, e envia ao site de visualização no GitHub junto com a página
      (visualizacao.html da pasta-fonte, publicada como index.html). */
const CRIPTO={
  b64(buf){ const u=new Uint8Array(buf); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); },
  unb64(t){ const s=atob(t), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; },
  async chave(senha,sal,iter){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:sal,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); },
  async abre(env,senha){ const k=await this.chave(senha,this.unb64(env.sal),env.iter);
    const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:this.unb64(env.iv)},k,this.unb64(env.dados));
    return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); },
  async fecha(obj,senha){ const iter=250000, sal=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const gz=await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    const k=await this.chave(senha,sal,iter); const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,gz);
    return {v:1,iter,sal:this.b64(sal),iv:this.b64(iv),dados:this.b64(c)}; }
};
window.CRIPTO = CRIPTO;   // a tela de senha da visualização usa estas funções
const b64txt = t => CRIPTO.b64(new TextEncoder().encode(t));
async function ghPut(cfg, caminho, conteudoB64, msg){
  const url=`https://api.github.com/repos/${cfg.usuario}/${cfg.repo}/contents/${caminho}`;
  const H={Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json'};
  let sha; const g=await fetch(url+'?ref=main',{headers:H,cache:'no-store'});
  if(g.ok) sha=(await g.json()).sha; else if(g.status!==404) throw new Error(g.status===401?'chave do GitHub recusada (confira se colou certo e se não expirou)':'GitHub respondeu '+g.status+' ao ler '+caminho);
  const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:msg,content:conteudoB64,sha,branch:'main'})});
  if(!r.ok){ const t=await r.text(); throw new Error('GitHub respondeu '+r.status+' ao gravar '+caminho+(r.status===403||r.status===404?' (a chave precisa de permissão de escrita em Contents neste repositório)':'')+' '+t.slice(0,120)); }
}

/* ---------------- aba: faturamento mensal ---------------- */
function viewFaturamento(){
  const todos = vendas();
  const anosCom = [...new Set(todos.map(v=>v.anoCom).filter(Boolean))].sort();
  if(!S.mAnoCom) S.mAnoCom = anosCom[anosCom.length-1] || new Date().getFullYear();
  const TODOS = S.mAnoCom==='todos';
  const filtra = ac => todos.filter(v=>(ac==='todos'||v.anoCom===ac) && v.projeto!==ACERVO
    &&(!S.mUF||v.uf===S.mUF)&&(!S.mReg||v.regiao===S.mReg)&&(!S.mRede||v.rede===S.mRede)&&(!S.mProj||v.projeto===S.mProj));
  const f = filtra(TODOS? 'todos' : +S.mAnoCom);
  const money = S.mMed==='valor', pessoas = S.mMed==='pessoas';
  // pessoas: alunos atendidos (kits de aluno × unidades por kit) + um professor por kit de professor,
  // como nas abas RESULTADOS da planilha
  const med = v => money? (v.valor||0)
    : pessoas? ((v.kitsAluno||0)*multDe(v.projeto) + (v.kitsProf||0))
    : ((v.kitsAluno||0)+(v.kitsProf||0));
  const projs = [...new Set(f.map(v=>v.projeto))].sort();
  // um ano: colunas = meses (ago a jul); todos os anos: colunas = anos comerciais
  const NC = TODOS? anosCom.length : 12;
  const col = v => TODOS? anosCom.indexOf(v.anoCom) : COM.indexOf(v.mes-1);
  const mat={}; projs.forEach(p=>mat[p]=Array(NC).fill(0));
  f.forEach(v=>{ const i=col(v); if(i>=0) mat[v.projeto][i]+=med(v); });
  const rot = TODOS? anosCom.map(rotCom) : COM.map(i=>MES[i]);
  const tot = Array(NC).fill(0); projs.forEach(p=>mat[p].forEach((x,i)=>tot[i]+=x));
  const geral = tot.reduce((a,b)=>a+b,0);

function faixas(vals){                       // 5 faixas por quantil
  const v=vals.slice().sort((a,b)=>a-b), n=v.length, c=[];
  for(let i=1;i<5;i++) c.push(v[Math.min(n-1,Math.floor(n*i/5))]);

const faixaDe = (x,c) => { let k=0; while(k<c.length && x>c[k]) k++; return k; };

function viewSeries(){
  const todas = vendas().filter(v=>v.projeto!==ACERVO);

  if(!S.sAno) S.sAno = anos[anos.length-1] || 'todos';
  const f = todas.filter(v=>(S.sAno==='todos'||v.ano===+S.sAno)&&(!S.sProj||v.projeto===S.sProj)
    &&(!S.sUF||v.uf===S.sUF)&&(!S.sReg||v.regiao===S.sReg)&&(!S.sOp||v.operacao===S.sOp));
  const prof = S.sPub==='professor';
  const campo = prof? 'serP' : 'serA';
  const porEixo = S.sEixo==='projeto';
  const cols = porEixo? [...new Set(f.map(v=>v.projeto))].sort()
                      : [...new Set(f.map(v=>v.ano))].filter(Boolean).sort().map(String);
  const chave = v => porEixo? v.projeto : String(v.ano);
  const mat = {}; CODS.forEach(c=>{mat[c]={}; cols.forEach(k=>mat[c][k]=0);});
  f.forEach(v=>{ const k=chave(v);
    Object.entries(v[campo]||{}).forEach(([c,q])=>{ if(mat[c]&&k in mat[c]) mat[c][k]+=q; }); });
  let totCol = {}; cols.forEach(k=>totCol[k]=CODS.reduce((s,c)=>s+mat[c][k],0));
  const comDado = cols.filter(k=>totCol[k]);
  if(comDado.length){ cols.length=0; comDado.forEach(k=>cols.push(k)); }
  const totSer = {}; CODS.forEach(c=>totSer[c]=cols.reduce((s,k)=>s+mat[c][k],0));

  });
  corpo += `<tr class="tot"><td class="l">Total</td>${cols.map(k=>`<td>${fmt(totCol[k])}</td>`).join('')}<td>${fmt(geral)}</td></tr>`;
  const alunos = f.reduce((s,v)=>s+(v.kitsAluno||0)*multDe(v.projeto),0);

    <div class="kpi"><div class="l">Kits de ${prof?'professor':'aluno'}</div><div class="v">${fmt(geral)}</div><div class="d">${S.sAno==='todos'?'todos os anos':'em '+S.sAno}</div></div>

  h += `<div class="card"><div class="filters">
      <label class="f"><span>Ano</span><select id="sano"><option value="todos"${S.sAno==='todos'?' selected':''}>Todos</option>${anos.slice().reverse().map(a=>`<option${+S.sAno===a?' selected':''}>${a}</option>`).join('')}</select></label>
      <label class="f"><span>Projeto</span><select id="sproj"><option value="">Todos</option>${projetos().map(p=>`<option value="${esc(p)}"${S.sProj===p?' selected':''}>${esc(short(p))}</option>`).join('')}</select></label>

      <label class="f"><span>UF</span><select id="suf"><option value="">Todas</option>${UFS().map(u=>`<option${S.sUF===u?' selected':''}>${u}</option>`).join('')}</select></label>
      <label class="f"><span>Operação</span><select id="sop"><option value="">Todas</option>${BASE.operacoes.map(o=>`<option${S.sOp===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label>
      <div class="f"><span>Público</span><div class="seg" role="group"><button type="button" data-spub="aluno" aria-pressed="${!prof}">Aluno</button><button type="button" data-spub="professor" aria-pressed="${prof}">Professor</button></div></div>

  $$('[data-seixo]').forEach(b=>b.onclick=()=>{S.sEixo=b.dataset.seixo; render();});
  const usadas = CODS.filter(c=>totSer[c]);

/* ---------------- literatura: estoque de livros ----------------
   Cruza o relatório do NetSuite (itens com ISBN) com o catálogo (LITERATURA - Catalogo):
   pelo ISBN e, quando o NetSuite usa outro ISBN, pelo título. Obra do catálogo que não aparece
   no relatório conta como sem saldo. */
const ED_COR = {'Movimenta':'var(--mag)','Prefácio':'var(--sky)','Rovelle':'var(--clay)'};
const ED_NOME = {'Movimenta':'Movimenta e MVT','Prefácio':'Prefácio','Rovelle':'Rovelle'};
const chaveTitL = t => { let x=normT(t).replace(/[^a-z0-9 ,]/g,' ').replace(/\s+/g,' ').trim(); const m=x.match(/^(.*),\s*(o|a|os|as|um|uma)$/); if(m) x=m[2]+' '+m[1]; return x.replace(/,/g,' ').replace(/\s+/g,' ').trim(); };
const BAIXO = 20;   // abaixo disto, "estoque baixo"
function catalogoLit(){ if(window.__SNAP) return (window.__SNAP.lit&&window.__SNAP.lit.fonte&&window.__SNAP.lit.fonte.catalogo)||[]; return (LIT&&LIT.catalogo)||[]; }
function estoqueLivros(){
  const L=(EST&&EST.livros)||[], cat=catalogoLit();
  const porIsbn=new Map(); L.forEach(b=>porIsbn.set(b.isbn,(porIsbn.get(b.isbn)||0)+(+b.qtd||0)));
  const usados=new Set(), linhas=[];
  const porTit=new Map(); L.forEach(b=>{ const k=chaveTitL(b.titulo); if(!porTit.has(k)) porTit.set(k,b); });
  cat.forEach(c=>{
    let q=null, via='isbn', nsIsbn=c.i;
    if(porIsbn.has(c.i)){ q=porIsbn.get(c.i); usados.add(c.i); }
    else { const b=porTit.get(chaveTitL(c.t)); if(b && !usados.has(b.isbn)){ q=+b.qtd||0; usados.add(b.isbn); via='titulo'; nsIsbn=b.isbn; } }
    linhas.push({t:c.t, e:c.e, a:c.a, p:c.p, isbn:c.i, ns:nsIsbn, qtd:q==null?0:Math.max(0,q), noRel:q==null, via, cat:true});
  });
  L.forEach(b=>{ if(!usados.has(b.isbn)) linhas.push({t:b.titulo, e:'', a:'', p:null, isbn:b.isbn, ns:b.isbn, qtd:Math.max(0,+b.qtd||0), noRel:false, via:'isbn', cat:false}); });
  return linhas;
}
const sitLivro = x => x.qtd<=0? 'sem' : x.qtd<BAIXO? 'baixo' : 'ok';

  h += `<div class="ed-cards">${eds.map(card).join('')}</div>`;
  const COLS=[38,16,16,14,16];
  h += `<div class="card"><p class="note" style="margin:0 0 12px">Estoque do relatório <b>${esc(EST.arquivo||'')}</b>. Obras marcadas com ◆ foram encontradas pelo título, porque o ISBN no NetSuite é diferente do catálogo.</p>
    ${fcols(COLS,[
      [1,1,multi('ms-lobra','Obra',cat.slice().sort((a,b)=>a.t.localeCompare(b.t,'pt-BR')).map(x=>[x.isbn,x.t]),fo,'Todas','obras',1)],
      [2,1,multi('ms-led','Editora',eds.map(e=>[e,ED_NOME[e]||e]),fe,'Todas','editoras',3)],
      [5,1,multi('ms-lsit','Situação',[['ok','Com estoque'],['baixo','Estoque baixo'],['sem','Sem saldo']],sit||'','Todas','situações',1,true)]])}
    ${f.length? `<div class="tw" style="max-height:640px"><table class="est-lit alinhada">${colg(COLS)}<thead><tr><th class="l">Obra</th><th class="l">Editora</th><th class="l">ISBN</th><th>Preço de capa</th><th>Em estoque</th></tr></thead><tbody>${

        <td class="l"><span class="ed-chip" style="--ed:${ED_COR[x.e]||'var(--muted)'}">${esc(ED_NOME[x.e]||x.e||'—')}</span></td>
        <td class="l mono">${esc(x.isbn)}${x.via==='titulo'?` <span class="tag" title="ISBN no NetSuite: ${esc(x.ns)}">◆</span>`:''}</td>
        <td>${x.p!=null? BRLf(x.p) : '<span class="tag">sem preço</span>'}</td><td>${pill(x)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhuma obra neste filtro.</div>'}
</div>`;
  $('#main').innerHTML = barraEstoque() + h; ligaEstoqueBotoes();
  ligaMulti('ms-lobra','lObra'); ligaMulti('ms-led','lEd'); ligaMulti('ms-lsit','lsit');
  const ls=$('#lsit'); if(ls) ls.onchange=()=>{ S.lsit=ls.value; render(); };
  const lo=$('#lord'); if(lo) lo.onchange=()=>{ S.lOrd=lo.value; render(); };

/* situação do pagamento a partir da coluna PAGAMENTO: data ou SIM = pago; vazia = em aberto;
   outro texto (consignação, bonificação, doação…) aparece como está */
function sitPag(v){ const t=String(v.pagamento==null?'':v.pagamento).trim();
  if(!t) return 'Em aberto'; if(/^\d{4}-\d{2}-\d{2}$/.test(t) || /^SIM$/i.test(t)) return 'Pago';
  return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase(); }
const corPag = k => k==='Pago'? 'var(--ok)' : k==='Em aberto'? 'var(--warn)' : 'var(--muted)';
function vendasFiltradas(){
  const daLinha = v => S.linha==='lit'? v.projeto===ACERVO : v.projeto!==ACERVO;
  let r = vendas().filter(v=>daLinha(v)&&(!S.vAno.length||S.vAno.includes(String(v.ano)))&&(S.linha==='lit'||!S.vProj.length||S.vProj.includes(v.projeto))&&(!S.vUF.length||S.vUF.includes(v.uf))&&(S.linha==='lit'||!S.vRede.length||S.vRede.includes(v.rede+' | '+v.uf))&&(!S.vVia.length||S.vVia.includes(v.via))&&(!S.vPag.length||S.vPag.includes(sitPag(v)))&&(!S.vOp||v.operacao===S.vOp));

  return r.sort((a,b)=>String(b.emissao||'').localeCompare(String(a.emissao||'')));
}

function detalheSeries(v){
  const linhas = CODS.filter(c=>(v.serA&&v.serA[c])||(v.serP&&v.serP[c]));
  if(!linhas.length && !v.acervo) return '<p class="note">Sem detalhe por ano de escolaridade neste pedido.</p>';
  if(!linhas.length) return `<p class="note">${fmt(v.acervo)} exemplares de acervo literário.</p>`;
  return `<div class="tw" style="max-width:520px"><table><thead><tr><th class="l">Ano de escolaridade</th><th>Aluno</th><th>Professor</th></tr></thead><tbody>
    ${linhas.map(c=>`<tr><td class="l">${ROT[c]}</td><td>${fmt((v.serA||{})[c]||0)}</td><td>${fmt((v.serP||{})[c]||0)}</td></tr>`).join('')}
    <tr class="tot"><td class="l">Total</td><td>${fmt(v.kitsAluno)}</td><td>${fmt(v.kitsProf)}</td></tr></tbody></table></div>`;
}

const logoProj = p => { const c=String(p||'').slice(0,2); const src=LOGOPROJ[c]||LOGOPROJ['00']; return `<img src="${src}" alt="${esc(short(p)||'Movimenta')}">`; };
let JANELA_PROJ='';
function abreJanela(html, larga, proj){
  JANELA_PROJ=proj||'';
  fechaJanela();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='janela';
  const ic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
  const m=html.match(/^\s*<h2>([\s\S]*?)<\/h2>\s*<p class="sub">([\s\S]*?)<\/p>/);
  const titulo=m?m[1]:'', sub=m?m[2]:'', corpo=m? html.slice(m[0].length) : html;
  const cab=`<div class="jcab">
      <div class="jlogo">${logoProj(proj)}</div>
      <div class="jtit"><h2>${titulo}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>
      <div class="jbtn" data-noprint>
        <button class="btn sm ico" type="button" data-print="copiar" aria-label="Copiar imagem" title="Copiar imagem — depois é só colar (Ctrl+V) no WhatsApp">${ic}<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
        <button class="btn sm ico" type="button" data-print="baixar" aria-label="Baixar imagem" title="Baixar imagem — salva a janela como PNG na pasta Downloads">${ic}<path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg></button>
        <button class="x" type="button" aria-label="Fechar" title="Fechar (Esc)">×</button></div></div>`;
  bg.innerHTML=`<div class="modal${larga?' larga':''}" role="dialog" aria-modal="true">${cab}${corpo}</div>`;
  document.body.appendChild(bg); document.body.classList.add('modal-on');
  bg.onclick=e=>{ if(e.target===bg) fechaJanela(); };
  bg.querySelector('.x').onclick=fechaJanela; bg.querySelector('.x').focus();
  bg.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>imprimeJanela(b.dataset.print));
}
/* ---------------- print da janela (para WhatsApp) ----------------
   Copia o conteúdo da janela para um SVG com <foreignObject>, com os estilos já
   aplicados em cada elemento, e desenha num canvas em resolução dobrada. */
function aviso(txt){
  const a=document.createElement('div'); a.className='aviso'; a.textContent=txt; document.body.appendChild(a);
  setTimeout(()=>a.remove(), 3200);
}
function nomeJanela(){
  const h=document.querySelector('#janela .jtit h2'), sub=document.querySelector('#janela .jtit .sub');
  const t=((h?h.textContent:'')+' '+short(JANELA_PROJ||'')).trim();
  return (t.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'detalhes').slice(0,60);
}
function imagemJanela(){
  const orig=document.querySelector('#janela .modal'); if(!orig) return Promise.reject(new Error('sem janela'));
  const largura=Math.ceil(orig.getBoundingClientRect().width);
  const clone=orig.cloneNode(true);
  const fonte="'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif";
  (function copia(o,c){
    if(o.nodeType!==1) return;
    const cs=getComputedStyle(o); let txt='';
    const livre=o.tagName!=='IMG' && o.tagName!=='svg' && o.tagName!=='SVG';   // largura e altura recalculadas: a fonte da imagem é outra
    for(let i=0;i<cs.length;i++){ const k=cs[i]; if(livre && /^(width|height|inline-size|block-size)$/.test(k)) continue; txt+=k+':'+cs.getPropertyValue(k)+';'; }
    c.setAttribute('style',txt);
    c.style.fontFamily = fonte;   // fontes da web não carregam dentro da imagem
    c.style.transition='none'; c.style.animation='none';
    const oc=o.children, cc=c.children;
    for(let i=0;i<oc.length;i++) copia(oc[i],cc[i]);
  })(orig,clone);
  clone.querySelectorAll('[data-noprint]').forEach(e=>e.remove());
  clone.querySelectorAll('table').forEach(e=>{e.style.width='100%';});
  clone.querySelectorAll('.jtit h2').forEach(e=>{e.style.flexWrap='nowrap'; e.style.whiteSpace='nowrap';});
  clone.querySelectorAll('.tw').forEach(e=>{e.style.maxHeight='none'; e.style.overflow='visible';});
  Object.assign(clone.style,{position:'static',margin:'0',width:largura+'px',height:'auto',minHeight:'0',maxWidth:'none',boxShadow:'none',maxHeight:'none',overflow:'visible'});
  const agora=new Date();
  const rod=document.createElement('div');
  rod.textContent='Movimenta · Controle de Vendas · '+agora.toLocaleDateString('pt-BR')+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  Object.assign(rod.style,{marginTop:'14px',paddingTop:'8px',borderTop:'1px solid '+getComputedStyle(orig).borderColor,fontSize:'11px',color:getComputedStyle(document.body).getPropertyValue('--muted')||'#777',fontFamily:fonte});
  clone.appendChild(rod);
  // mede a altura real montando o clone fora da tela
  const caixa=document.createElement('div'); Object.assign(caixa.style,{position:'fixed',left:'-10000px',top:'0',width:largura+'px'});
  caixa.appendChild(clone); document.body.appendChild(caixa);
  const altura=Math.ceil(Math.max(clone.getBoundingClientRect().height, clone.scrollHeight)) + 2;
  document.body.removeChild(caixa);
  const xml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${largura}" height="${altura}"><foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  return new Promise((ok,erro)=>{
    const img=new Image();
    img.onload=()=>{
      const esc=2, cv=document.createElement('canvas'); cv.width=largura*esc; cv.height=altura*esc;
      const ctx=cv.getContext('2d'); ctx.fillStyle=getComputedStyle(orig).backgroundColor||'#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.scale(esc,esc); ctx.drawImage(img,0,0);
      try{ cv.toBlob(b=>b? ok(b) : erro(new Error('falha ao gerar a imagem')),'image/png'); }catch(e){ erro(e); }
    };
    img.onerror=()=>erro(new Error('falha ao desenhar a janela'));
    img.src=url;
  });
}
function baixaBlob(blob, nome){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function imprimeJanela(modo){
  const nome=nomeJanela()+'.png';
  if(modo==='copiar' && navigator.clipboard && window.ClipboardItem){
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': imagemJanela()})]);
      aviso('Imagem copiada. Abra a conversa no WhatsApp e cole com Ctrl+V.');
      return;
    }catch(e){ /* sem permissão de área de transferência: cai para o download */ }
  }
  try{
    baixaBlob(await imagemJanela(), nome);
    aviso(modo==='copiar'? 'Não deu para copiar; a imagem foi baixada como '+nome+'.' : 'Imagem salva em Downloads: '+nome);
  }catch(e){ aviso('Não foi possível gerar a imagem: '+e.message); }
}
function fechaJanela(){ const j=document.getElementById('janela'); if(j) j.remove(); document.body.classList.remove('modal-on'); if(typeof PDF_URL!=='undefined' && PDF_URL){ const u=PDF_URL; PDF_URL=''; setTimeout(()=>URL.revokeObjectURL(u),60000); } }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') fechaJanela(); });

function tabelaSeriesJanela(v){
  const segs=[['EI','Educação infantil'],['AI','Anos iniciais'],['AF','Anos finais'],['EM','Ensino médio']];
  const tem=c=>((v.serA||{})[c]||0)+((v.serP||{})[c]||0);
  let corpo='';
  segs.forEach(([s,nome])=>{ const cs=CODS.filter(c=>c.startsWith(s)&&tem(c)); if(!cs.length) return;
    corpo+=`<tr class="grp"><td class="l" colspan="3">${nome}</td></tr>`+cs.map(c=>`<tr><td class="l">${ROT[c]}</td><td>${fmt((v.serA||{})[c]||0)}</td><td>${fmt((v.serP||{})[c]||0)}</td></tr>`).join('');

function linhasFutura(f, al){
  // uma linha por ano de escolaridade e público, com preço de tabela e faturamento líquido
  const det = al&&al.det&&al.det.length? al.det.filter(d=>d.pedido)
    : [].concat(...[['aluno','serA'],['professor','serP']].map(([pub,c])=>Object.entries(f[c]||{}).filter(([,q])=>q).map(([s,q])=>({pub,serie:s,pedido:q,atendido:null,cadastrado:true}))));
  return det.map(d=>{ const tab=precoDe(f.projeto, segDe(d.serie), d.pub==='aluno'?'aluno':'prof'), liq=precoLiq(tab);
    return {...d, tab, liq, fatPrev:d.pedido*liq, fatAt:d.atendido==null? null : d.atendido*liq, fatFalta:d.atendido==null? null : (d.pedido-d.atendido)*liq}; })
    .sort((x,y)=>(x.pub===y.pub?0:x.pub==='aluno'?-1:1) || CODS.indexOf(x.serie)-CODS.indexOf(y.serie));
}
function tabelaFutura(L, comEst){
  if(!L.length) return '';
  const mt = comEst && L.some(d=>d.monta!=null);   // MAJOG: kits que dá para montar com os componentes em estoque
  const th = comEst? '<th class="sep">Atende</th><th>Falta</th>'+(mt?'<th class="sep" title="Kits que dá para montar com os componentes em estoque">Montando</th><th title="O que falta depois de montar">Produzir</th>':'')+'<th class="sep">Fat. atendido</th><th>Fat. faltante</th>' : '';
  const mtc = (ped,at,mo)=>{ const fa=ped-at, pr=fa-(mo||0); return `<td class="sep">${mo? `<b style="color:var(--mag)">${fmt(mo)}</b>` : '—'}</td><td class="${pr>0?'bad':'ok'}">${pr>0? fmt(pr) : '—'}</td>`; };
  const soma=(arr,k)=>arr.reduce((a,x)=>a+(x[k]||0),0);
  const linha=(d)=>`<tr><td class="l">${ROT[d.serie]||d.serie}</td><td>${BRLf(d.tab)}</td><td>${BRLf(d.liq)}</td><td>${fmt(d.pedido)}</td><td>${BRLf(d.fatPrev)}</td>${comEst? `
      <td class="sep ${d.atendido>=d.pedido?'ok2':''}">${fmt(d.atendido)}</td>
      <td class="${d.pedido-d.atendido>0?'bad':'ok'}">${d.pedido-d.atendido>0? fmt(d.pedido-d.atendido)+(d.cadastrado?'':' <span class="tag" title="Este kit (projeto, público e ano) não aparece na planilha de estoque; conta como zero">fora do estoque</span>') : '—'}</td>${mt? mtc(d.pedido,d.atendido,d.monta) : ''}
      <td class="sep ${d.atendido>=d.pedido?'ok2':''}">${BRLf(d.fatAt)}</td><td class="${d.fatFalta>0?'bad':'ok'}">${d.fatFalta>0? BRLf(d.fatFalta) : '—'}</td>` : ''}</tr>`;
  const tot=(rot,arr,cls)=>`<tr class="${cls}"><td class="l">${rot}</td><td></td><td></td><td>${fmt(soma(arr,'pedido'))}</td><td>${BRLf(soma(arr,'fatPrev'))}</td>${comEst?
      `<td class="sep ${soma(arr,'pedido')-soma(arr,'atendido')<=0?'ok2':''}">${fmt(soma(arr,'atendido'))}</td><td class="${soma(arr,'pedido')-soma(arr,'atendido')>0?'bad':''}">${fmt(soma(arr,'pedido')-soma(arr,'atendido'))}</td>${mt? mtc(soma(arr,'pedido'),soma(arr,'atendido'),soma(arr,'monta')) : ''}<td class="sep ${soma(arr,'pedido')-soma(arr,'atendido')<=0?'ok2':''}">${BRLf(soma(arr,'fatAt'))}</td><td class="${soma(arr,'fatFalta')>0.005?'bad':''}">${BRLf(soma(arr,'fatFalta'))}</td>`:''}</tr>`;
  const ncol = comEst? (mt?11:9) : 5;
  let corpo='';
  [['aluno','Kits de aluno'],['professor','Kits de professor']].forEach(([pub,nome])=>{
    const g=L.filter(d=>d.pub===pub); if(!g.length) return;
    corpo+=`<tr class="grp"><td class="l" colspan="${ncol}">${nome}</td></tr>`+g.map(linha).join('');
    corpo+=tot('Subtotal '+(pub==='aluno'?'aluno':'professor'),g,'sub');
  });
  corpo+=tot('Total',L,'tot');
  return `<div class="tw"><table class="miuda atd"><thead><tr><th class="l">Ano</th><th>Preço tabela</th><th>Preço c/ desc.</th><th>Kits previstos</th><th>Fat. previsto</th>${th}</tr></thead><tbody>${corpo}</tbody></table></div>`;
}

      <section class="caixa"><h3>Cliente</h3><div class="ficha linha">

const chaveEst = (p,pub,s) => p+'|'+pub+'|'+s;
function mapaEstoque(){
  const m = new Map();
  if(!EST) return m;
  EST.itens.forEach(i=>{
    const k = chaveEst(i.projeto, i.publico, i.serie);
    m.set(k, (m.get(k)||0) + (i.qtd||0));
  });
  return m;
}
/* Quanto do funil o estoque de hoje atende, em dois modos:
   'fila' — as negociações são atendidas na ordem do mês previsto (empate: a maior
            primeiro). A primeira reserva o estoque, a seguinte fica com o que sobrou.
   'ind'  — cada negociação é comparada contra o estoque cheio, sem reservar nada.
            Responde "esta rede, se fosse a única, seria atendida?". A soma dos
            atendimentos pode passar do estoque existente. */
function alocaFunil(modo, conj){
  const consome = modo !== 'ind';
  const disp = mapaEstoque(), dispM = montavelMajog();
  const fila = (conj||BASE.futuras).filter(f=>f.mesPrevisto).slice()
    .sort((x,y)=> x.mesPrevisto.localeCompare(y.mesPrevisto) || (y.valor||0)-(x.valor||0));
  const saida = new Map();
  fila.forEach(f=>{
    const det = [];
    let pedA=0, atdA=0, pedP=0, atdP=0, brutoTudo=0, brutoAtend=0;
    [['aluno','serA'],['professor','serP']].forEach(([pub,campo])=>{
      Object.entries(f[campo]||{}).forEach(([s,q])=>{
        const k = chaveEst(f.projeto, pub, s);
        const cadastrado = disp.has(k);
        const tem = Math.max(0, cadastrado? disp.get(k) : 0);
        const usa = Math.min(q, tem);
        if(cadastrado && consome) disp.set(k, tem - usa);
        // MAJOG: o que falta pode sair dos kits que dá para montar com os componentes em estoque
        const temM = dispM.has(k)? Math.max(0, dispM.get(k)) : null;
        const monta = temM==null? null : Math.min(q-usa, temM);
        if(monta!=null && consome) dispM.set(k, temM - monta);
        // o valor atendido sai da proporção pelo preço de tabela, aplicada sobre o
        // faturamento da própria negociação — assim o desconto dela é respeitado
        const preco = precoDe(f.projeto, segDe(s), pub==='aluno'?'aluno':'prof');
        brutoTudo += q * preco; brutoAtend += usa * preco;
        if(pub==='aluno'){ pedA+=q; atdA+=usa; } else { pedP+=q; atdP+=usa; }
        det.push({pub, serie:s, pedido:q, atendido:usa, cadastrado, monta});
      });
    });
    const ped = pedA+pedP, atd = atdA+atdP;
    const fração = brutoTudo? brutoAtend/brutoTudo : (ped? atd/ped : 0);
    saida.set(f.id, {det, pedA, atdA, pedP, atdP, ped, atd,
      cobertura: ped? atd/ped : 0, valorAtendido: +precoLiq(brutoAtend).toFixed(2), valorPrevisto: +precoLiq(brutoTudo).toFixed(2), fração});
  });
  return saida;
}

/* ---------------- estoque: montagem de kits do MAJOG ----------------
   Cruza a composição dos kits (PROJETOS - Composicao dos kits) com o saldo de cada item no NetSuite.
   Em cada ano, monta primeiro o kit escolhido como prioridade e depois o outro com o que sobrou
   (o livro do aluno entra nos dois). */
function calcMontagem(){
  const C = (BASE.comp||COMP), linhas = C? C.linhas.filter(l=>SEMACENTO(l.projeto)==='MAJOG') : [];
  if(!EST || !EST.cods || !linhas.length) return null;
  const saldo = c => Math.max(0, +(EST.cods[c]||0));
  const anos = [...new Set(linhas.map(l=>l.ano))];
  const prio = S.mPrio==='professor'? ['Professor','Aluno'] : ['Aluno','Professor'];
  const res = anos.map(ano=>{
    const disp = {}, kits = {};
    prio.forEach(kit=>{
      const comp = linhas.filter(l=>l.ano===ano && SEMACENTO(l.kit)===SEMACENTO(kit)); if(!comp.length) return;
      const lim = comp.filter(l=>l.cod).map(l=>Math.floor((l.cod in disp? disp[l.cod] : saldo(l.cod))/(l.qtd||1)));
      const n = lim.length? Math.max(0,Math.min(...lim)) : 0;
      const itens = comp.map(l=>{ if(!l.cod) return {l, sem:true};
        const d = (l.cod in disp? disp[l.cod] : saldo(l.cod)), cons = n*l.qtd; disp[l.cod] = d - cons;
        return {l, d, cons, resta:d-cons, limita: Math.floor(d/(l.qtd||1))===n}; });
      kits[kit] = {n, itens, prontos: saldo(comp[0].ean)};
    });
    return {ano, kits};
  });
  return {C, prio, res};
}
// "4 anos" -> EI4, "1º ano" -> AI1, "6º ano" -> AF6
const serieDoAno = a => { const n=(String(a).match(/\d/)||[''])[0]; return /ANOS?$/.test(SEMACENTO(a).trim()) && !/º|°/.test(a)? 'EI'+n : (+n<=5?'AI':'AF')+n; };
function montavelMajog(){ const M=calcMontagem(); const m=new Map(); if(!M) return m;
  M.res.forEach(r=>Object.entries(r.kits).forEach(([kit,k])=>m.set(chaveEst('02 - MAJOG', kit==='Aluno'?'aluno':'professor', serieDoAno(r.ano)), k.n))); return m; }

  h += `<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:8px">
      <div><h2 style="margin:0">Montagem de kits do MAJOG por ano</h2><p class="sub" style="margin:2px 0 0">Composição de <b>${esc((C&&C.arquivo)||'')}</b> × saldo de <b>${esc(EST.arquivo||'')}</b>. Só itens da 2ª edição.</p></div>

function ajustaPop(pop){ pop.style.left=''; pop.style.right=''; pop.style.top='';

async function arquivoDaPasta(caminho){

  return (await d.getFileHandle(partes[partes.length-1])).getFile();
}

function copia(txt){
  const ok = ()=>{ ARQC.msg = 'Pedido copiado. Cole aqui na conversa com o Claude.'; render(); };
  const plano = ()=>{ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); let r=false; try{ r=document.execCommand('copy'); }catch(e){} t.remove(); return r; };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok,()=>{ if(plano()) ok(); }); }
  else if(plano()) ok();
}

/* universo: vendas públicas com PAGAMENTO em branco, fora acervo e redes privadas */
function pendentes(){
  const priv = new Set(((CONC&&CONC.privadas)||PRIV_PADRAO).map(x=>String(x).toUpperCase()));
  const idx = {}; ((CONC&&CONC.itens)||[]).forEach(i=>{ idx[chaveNF(i.rede,i.nf)] = i; });
  return vendas().filter(v=>v.operacao==='VENDA' && v.projeto!==ACERVO && !String(v.pagamento||'').trim()
      && v.nf && !priv.has(String(v.rede).toUpperCase()))
    .map(v=>{ const c = idx[chaveNF(v.rede,v.nf)];
      return {...v, nfn:nfNorm(v.nf), conc:c||null, situacao: c? c.situacao : 'Não consultado', dias: diasDesde(v.emissao)}; });
}

/* ---------------- comissão Enzo (só no app do administrador) ----------------
   Vendas de projeto (operação VENDA, fora o acervo) com NF emitida a partir de 01/06/2026.
   Comissão de 0,4%. Nas vendas de inexigibilidade (feitas pela Movimenta, MVT ou Prefácio com 50% de
   desconto), a comissão é calculada sobre 50% do valor da venda. Separadas em recebidas e a receber. */
const COM_DESDE = '2026-06-01', COM_PCT = 0.004;
const comInexig = v => /^(MOVIMENTA|MVT|PREFACIO)/.test(SEMACENTO(v.via).trim()) && Math.abs((+v.desconto||0)-0.5) < 0.005;
const comBase = v => (v.valor||0) * (comInexig(v)? 0.5 : 1);
// processos anteriores à entrada do Enzo: não entram na comissão (lista mantida aqui, por NF e rede)
const COM_ANTERIORES = [['4000','ARARUAMA'],['4036','COLEGIO BEM ME QUER'],['642','SUZANO'],['645','SUZANO']];
const comAnterior = v => COM_ANTERIORES.some(([nf,rede])=>String(v.nf).trim()===nf && SEMACENTO(v.rede).trim()===rede);
function vendasComissao(anteriores){
  return vendas().filter(v=>v.projeto!==ACERVO && v.operacao==='VENDA' && String(v.emissao||'')>=COM_DESDE && (anteriores? comAnterior(v) : !comAnterior(v)))
    .sort((a,b)=>String(a.emissao).localeCompare(String(b.emissao))||String(a.nf).localeCompare(String(b.nf)));
}
const MESES_LONGOS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesLongo = ym => MESES_LONGOS[+ym.slice(5,7)-1]+'/'+ym.slice(0,4);
const mesSeg = ym => { const y=+ym.slice(0,4), m=+ym.slice(5,7); return m===12? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); };
/* primeiro passo: escolher o mês dos recebimentos; a comissão desse mês é paga no mês seguinte */

      <tr class="tot"><td class="l">Subtotal</td><td></td><td></td><td></td><td></td><td></td><td>${BRLf(soma(L,v=>v.valor||0))}</td><td>${BRLf(soma(L,comBase))}</td><td>${BRLf(soma(L,com))}</td><td></td></tr></tbody></table></div>`

  const html = `<h2>Comissão Enzo · ${esc(mesLongo(mes))}</h2><p class="sub">Recebimentos de ${esc(mesLongo(mes))}, comissão paga em ${esc(mesLongo(mesSeg(mes)))} · vendas de projeto com NF a partir de ${brD(COM_DESDE)} · ${dec(COM_PCT*100,1)}%</p>

    ${fora.length? `<p class="note" style="margin-top:12px">Fora da conta: ${fora.map(v=>`NF ${esc(v.nf)} (${esc(sitPag(v))})`).join(', ')}.</p>` : ''}`;

function viewPagamentos(){

    && (!S.pProj.length||S.pProj.includes(p.projeto)) && (!S.pCred.length||S.pCred.includes(credDe(p))));
  const opc = f => [...new Set(todos.map(f))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const tot = todos.reduce((s,p)=>s+(p.valor||0),0);

  const fatRedes = vendas().filter(v=>v.operacao==='VENDA' && redesSet.has(v.rede+'|'+v.uf)).reduce((s,v)=>s+(v.valor||0),0);
  const aberto = todos.filter(p=>p.situacao==='Em aberto no portal');   // já pagos ao credor não são reconsultados
  const naoId = todos.filter(p=>p.situacao!=='Em aberto no portal'&&p.situacao!=='Pago ao credor');
  const kpi = (l,v,d,cor)=>`<div class="kpi"${cor?` style="border-top:3px solid ${cor}"`:''}><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;

  let h = barraConc();
  // quadros fixos, sempre na mesma linha: nosso valor + as quatro situações (Não consultado só aparece se houver)
  const fixos = ['Pago ao credor','Em aberto no portal','Pagamento não verificado','Não localizado'];
  const sits = SIT.filter(([s])=>fixos.indexOf(s)>=0 || sitCount[s].n);

    ${kpi('Nosso valor',BRL(tot),`${fmt(todos.length)} notas · ${fmt(redesSet.size)} redes`)}
    ${sits.map(([s,d,c])=>kpi(s==='Pagamento não verificado'?'Pagto. não verificado':s,BRL(sitCount[s].v),fmt(sitCount[s].n)+' notas · '+d,c)).join('')}</div>`;

  // ações

  if(!document.body.classList.contains('snap')) h += `<div class="card"><h2>Ações</h2><p class="sub">A consulta aos portais é feita pelo Claude: os botões de consulta abrem os portais e copiam o pedido pronto para colar na conversa.</p>

const titleCaseL = t => String(t).replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|[\s\-–(/"“‘'.:])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
async function primeiraAba(file){
  const z = await abreZip(await file.arrayBuffer()); leSST(z);
